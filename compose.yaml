services:
  server:
    build:
      context: .
      target: development
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      mongo:
        condition: service_started
    networks:
      - subledger-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - subledger-network

volumes:
  mongo-data:

networks:
  subledger-network:
    driver: bridge
