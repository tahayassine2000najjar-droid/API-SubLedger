version: "3.8"

services:
  server:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"

    volumes:
      - .:/app

    command: npm run dev

    depends_on:
      - mongo

  mongo:
    image: mongo:7

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
